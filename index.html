.echip{min-width:58px;min-height:40px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--fg);text-transform:capitalize}
.echip.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.echip.used{opacity:.45}
.echip.e-rot{border-left:10px solid #e11d48}.echip.e-gelb{border-left:10px solid #eab308}.echip.e-grün{border-left:10px solid #16a34a}.echip.e-schwarz{border-left:10px solid #111827}
.torso{display:block;width:100%;max-width:330px;margin:4px auto 10px;touch-action:manipulation}

.tline{fill:none;stroke:var(--fig-line);stroke-width:1.6}.tline.faint{stroke-dasharray:3 4;opacity:.8}
.tlab{font-size:12px;fill:var(--muted);font-weight:600}
.espot{cursor:pointer}
.espot circle{fill:var(--surface);stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3;transition:all .2s}
.espot:hover circle,.espot:focus circle{fill:var(--accent-soft)}
.espot:focus{outline:none}
.espot.set circle{stroke-dasharray:none;fill:var(--accent);}
.espot circle.e-rot{fill:#e11d48}.espot circle.e-gelb{fill:#eab308}.espot circle.e-grün{fill:#16a34a}.espot circle.e-schwarz{fill:#111827}
.espot.ok circle{stroke:var(--ok);stroke-width:4}.espot.bad circle{stroke:var(--bad);stroke-width:4}.espot.miss circle{stroke:var(--warn);stroke-width:3;stroke-dasharray:none}
.elab{font-size:11px;fill:var(--muted);font-weight:600;pointer-events:none}
.vlab{font-size:9.5px;fill:var(--on-accent);font-weight:800;pointer-events:none}
.espot:not(.set) .vlab{fill:var(--fg)}
.bags{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px;margin:10px 0 14px}
.bag{width:100%;display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-size:13.5px;line-height:1.35;position:relative}
.bag::before{content:"";position:absolute;right:12px;top:12px;width:18px;height:24px;border-radius:5px 5px 8px 8px;background:#b91c1c;opacity:.85}
.bag b{font-size:15px}.bag .bgr{font-weight:700;color:var(--bad-ink)}
.bag.on{border-color:var(--accent);background:var(--accent-soft)}
.bag.ok{border-color:var(--ok);background:var(--ok-soft)}.bag.bad{border-color:var(--bad);background:var(--bad-soft)}
.bscard{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px;padding:14px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.bscard>div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.bscard small{color:var(--muted);font-size:12px}
.agg{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#dc2626 0 55%,#f87171 56% 100%);border:3px solid #fff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.agg.on{background:radial-gradient(circle at 30% 35%,#7f1d1d 0 9%,transparent 10%),radial-gradient(circle at 62% 30%,#7f1d1d 0 11%,transparent 12%),radial-gradient(circle at 45% 65%,#7f1d1d 0 13%,transparent 14%),radial-gradient(circle at 72% 66%,#7f1d1d 0 8%,transparent 9%),#fecaca}
.breath{display:grid;gap:12px;justify-items:center;margin:8px 0}
.baby{width:100%;max-width:280px}
.baby svg{width:100%;display:block}
.bbed{fill:var(--surface2)}.bhead{fill:#f6d2b3;stroke:var(--fig-line);stroke-width:1.5}.bbody{fill:#bfdbfe;stroke:var(--fig-line);stroke-width:1.5}.bribs{fill:none;stroke:#64748b;stroke-width:1.6;opacity:0}
.bchest{transform-origin:92px 80px;transform-box:view-box}
.baby.go .bchest{animation:bbreath var(--bp,1s) ease-in-out infinite}
.baby.go .bribs{animation:bribs var(--bp,1s) ease-in-out infinite}
@keyframes bbreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,1.12)}}
@keyframes bribs{0%,40%,100%{opacity:0}50%,60%{opacity:.9}}
.btn.big{min-height:64px;min-width:200px;font-size:18px;border-radius:20px}
.findings{display:grid;gap:6px;padding:12px 14px;border-radius:14px;background:var(--tint);border:1px solid var(--line);font-size:14.5px;margin:10px 0}
@media (prefers-reduced-motion:reduce){.baby.go .bchest,.baby.go .bribs{animation-duration:calc(var(--bp,1s) * 1)}}

/* ---------- Praxisauftrag ---------- */
.pchecks{display:grid;gap:8px;margin-top:12px}
.pcheck{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;line-height:1.45}
.pcheck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.pcheck.on{background:var(--ok-soft);border-color:transparent}
.pcheck.on span{color:var(--muted)}

/* ---------- Praxis-Seite ---------- */
.fgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:4px 14px;margin-top:10px}
.fgrid2 .input{max-width:none;width:100%}
.einfo{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:14.5px}
.minichips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.mchip{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s}
.mchip:hover{border-color:var(--accent);transform:translateY(-1px)}
.mchip b{font-size:15px;line-height:1.3}
.ptlist{display:grid;gap:8px}
.ptitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.ptitem:not(.static):hover{border-color:var(--accent)}
.ptitem b{display:block;font-size:15px;line-height:1.3}.ptitem small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.ptitem>svg{width:18px;height:18px;margin-left:auto;flex:none;color:var(--muted)}
.ptitem.static{flex-wrap:wrap}
.ptck{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}
.ptck svg{width:16px;height:16px}
.ptitem.done .ptck,.ptitem.static .ptck:has(svg){background:var(--ok);color:#fff}
.skbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:4px 0 10px}
.skbar i{display:block;height:100%;transition:width .4s var(--ease)}
.l3{--c:var(--ok)}.l2{--c:var(--accent)}.l1{--c:var(--warn)}.l0{--c:var(--fig-line)}
.skbar i,.sklegend i{background:var(--c)}
.sklegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:8px}
.sklegend span{display:inline-flex;align-items:center;gap:6px}.sklegend i{width:10px;height:10px;border-radius:3px}
.sklist{display:grid;gap:0;margin-top:12px}
.skrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.skrow b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}.skrow small{color:var(--muted);font-size:12.5px}
.seg4{display:flex;flex:none;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg4 button{hyphens:manual;-webkit-hyphens:manual;border:0;background:none;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg4 button[aria-checked="true"]{background:var(--c);color:#fff}
.seg4 button.l0[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
@media (max-width:640px){.skrow{flex-direction:column;align-items:stretch;gap:8px}.seg4 button{flex:1;padding:8px 2px;font-size:11.5px;white-space:normal;line-height:1.15}}
.gsteps{list-style:none;display:flex;gap:6px;padding:0;margin:14px 0;overflow-x:auto}
.gsteps button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 5px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.gsteps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px}
.gsteps .done i{background:var(--ok);color:#fff}
.gsteps .cur{border-color:var(--accent);color:var(--fg)}.gsteps .cur i{background:var(--accent);color:#fff}
.diaryed textarea{max-width:none;width:100%;margin-top:8px;resize:vertical}
.skip.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}.skip.back svg{width:16px;height:16px}
.btn.danger{color:var(--bad-ink)}
.diaryprint{display:none}
@media print{body.print-diary #root{display:none!important}body.print-diary .diaryprint{display:block!important}body.print-diary .diaryprint section{display:none}body.print-diary .diaryprint section.pr{display:block;font:12pt/1.5 Georgia,serif;color:#000}
  body.print-diary .diaryprint h1{font-size:18pt;margin:0 0 4pt}body.print-diary .diaryprint h2{font-size:12pt;margin:14pt 0 2pt}}
.pocket{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;margin-top:12px}
.pcard{margin:0}
.star{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);display:grid;place-items:center}
.star svg{width:20px;height:20px}.star.on{color:#eab308;background:var(--warn-soft)}.star.on svg{fill:currentColor}
.pdl{margin:10px 0 0;display:grid;gap:0}
.pdl>div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.pdl dt{font-weight:600}.pdl dd{margin:0;color:var(--fg)}
.pnote{font-size:12.5px;margin:8px 0 0}
/* ---------- Blitzrunde ---------- */
.bhead2{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.btimer{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.btimer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}.btimer i.low{background:var(--bad)}
.bsec{font-variant-numeric:tabular-nums;font-size:20px;min-width:30px;text-align:right}
.blitz .opts{margin-top:12px}
.bwrong{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.bwrong li{display:grid;gap:3px;padding:10px 14px;border-radius:14px;background:var(--surface2);font-size:14.5px}
.bwrong span{color:var(--ok-ink);font-weight:600}.bwrong small{color:var(--muted);font-size:13px}
@media (max-width:420px){.tabbar{width:calc(100vw - 24px)}.tabbar .tab{min-width:0;flex:1 1 0;padding:8px 2px 6px;font-size:10px}}
.tbody path,.tbody circle{fill:var(--surface2);stroke:var(--fig-line);stroke-width:2}
.bface{fill:#334155}.bmouth,.barm{fill:none;stroke:#94a3b8;stroke-width:2;stroke-linecap:round}

/* Ergänzungen für das Lehrer-Portal. Grundlage ist das Design-System der Schüler-App (style.css). */
.wrap.wide{max-width:1180px}
.lwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lcard{width:min(460px,100%);display:flex;flex-direction:column;gap:16px}
.lform{display:flex;flex-direction:column;gap:14px}.lform .input{max-width:none;width:100%}
.splash2{min-height:100vh;display:grid;place-items:center;align-content:center;gap:14px}
.notice{border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45;margin:10px 0;background:var(--surface2)}
.notice.ok{background:var(--ok-soft);color:var(--ok-ink)}.notice.bad{background:var(--bad-soft);color:var(--bad-ink)}.notice.warn{background:var(--warn-soft);color:var(--warn-ink)}
.notice.floating{position:fixed;left:16px;right:16px;bottom:16px;z-index:90;max-width:560px;margin:auto}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:650;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}.pill.part,.pill.p1{background:var(--warn-soft);color:var(--warn-ink)}.pill.bad,.pill.p0{background:var(--bad-soft);color:var(--bad-ink)}.pill.p2{background:var(--ok-soft);color:var(--ok-ink)}
.cav{display:inline-block;border-radius:50%;overflow:hidden;background:var(--surface2);flex-shrink:0;width:40px;height:40px}.cav svg{width:100%;height:100%;display:block}
.cast{display:flex}.cast .cav{margin-right:-8px;border:2px solid var(--surface)}
.tmod{cursor:default}.tmod .row .btn{flex:0 0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:22px}
.kpis>div{display:flex;flex-direction:column;gap:4px}.kpis b{font-size:34px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}.kpis span{color:var(--muted);font-size:14px}
.kpis.small{margin-top:0;grid-template-columns:repeat(2,1fr)}.kpis.small b{font-size:24px}.kpis.small>div{background:var(--surface2);border-radius:14px;padding:12px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.qa{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--fg);font:inherit;transition:transform .2s var(--ease)}.qa:hover{transform:translateY(-2px)}.qa svg{width:26px;height:26px;color:var(--accent)}
.recent{list-style:none;margin:0;padding:0}.recent li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}.recent li:first-child{border-top:0}.recent li span:nth-child(2){grid-column:1}.recent li span:last-child{grid-row:1;grid-column:2;font-size:13px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:22px;padding:18px}.toolbar .field{min-width:160px}.grow{flex:1;min-width:0}
.toolbar .input,.card .input{max-width:none;width:100%}
.input{height:46px;font-size:15.5px;border-radius:12px}
textarea.input{min-height:0;height:auto;padding:10px 12px;font-size:15.5px;line-height:1.45}
textarea.input.mono,.jsonview{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
select.input{appearance:auto;padding:0 10px}
.tablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:var(--surface2)}.tbl td small{display:block;color:var(--muted);font-size:12.5px}
.matrix th span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);max-height:150px;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-weight:600}
.matrix td.mc{position:relative;text-align:center;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;min-width:36px;padding:8px 4px}.matrix td.mc i{position:absolute;inset:3px;border-radius:6px;background:var(--accent);z-index:0}.matrix td.mc{z-index:0}
.matrix td.mc{color:var(--fg)}
.drawer.wide{width:min(620px,100vw);overflow-y:auto}
.mrow{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:0;color:var(--fg)}.mrow svg{width:20px;height:20px;flex-shrink:0}
.alistwrap{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.arow{border-top:1px solid var(--line);padding-top:10px}.ahead{display:flex;justify-content:space-between;gap:10px;align-items:center}.aq{margin:4px 0 6px;font-size:14.5px;font-weight:550}
.atext{margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--tint);border-radius:0 10px 10px 0;font-size:14.5px;white-space:pre-wrap}
.alist{margin:0;padding-left:18px;font-size:14px}.alist li{margin:3px 0}.aline{margin:0;font-size:14px}
.clist{display:flex;flex-direction:column;gap:12px;margin-top:14px}.crow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px 20px}
.invlist{display:flex;flex-direction:column;gap:6px;margin-top:12px}.inv{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}.inv code{font-size:16px;font-weight:700;letter-spacing:.12em}
.empty{text-align:center}
.danger{color:var(--bad-ink)!important}
.icononly{padding-inline:10px}
/* Modal */
.modal{position:fixed;z-index:80;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);animation:fadeIn .25s both}
.modal.wide{width:min(980px,calc(100vw - 24px))}.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}.mh h2{font-size:20px}.mb{padding:20px}
.palg{margin-bottom:18px}.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px;margin-top:8px}
.palitem{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;color:var(--fg);transition:border-color .2s,transform .2s var(--ease)}.palitem:hover{border-color:var(--accent);transform:translateY(-1px)}.palitem small{color:var(--muted);font-size:13px;line-height:1.35}
.kdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}.kdot.g0{background:#94a3b8}.kdot.g1{background:var(--accent)}.kdot.g2{background:var(--ok)}.kdot.g3{background:var(--warn)}.kdot.g4{background:#a855f7}

.qrinfo{display:flex;flex-direction:column;gap:10px;min-width:0}.qrurl code{display:block;font-size:12.5px;background:var(--surface2);padding:8px 10px;border-radius:10px;overflow-wrap:anywhere}

@media (max-width:600px){.qrbox{grid-template-columns:1fr}.qrimg{max-width:260px;margin:auto}}
@media print{.side,.tabbar,.topbar,.scrim,.mh,.qrinfo .row,.qrinfo small{display:none!important}.modal{position:static;transform:none;border:0;box-shadow:none;width:auto}.main{margin:0!important}.main>*:not(.modal){display:none}}
