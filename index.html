<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fallpfad Lehrer-Portal</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0062FF">
<script>window.addEventListener("error",function(e){if(/config\.js/.test(e.filename||""))window.FALLPFAD_CONFIG_ERROR=String(e.message||"Syntaxfehler");});</script>
<script src="config.js"></script>
<style>body{margin:0}/* Layout: Seitenleiste ab 960px, darunter schwebende Tab-Bar; Inhalt in einer Lesespalte. Neutral, ein Akzent, keine Leuchteffekte. */
:root{
  --bg:#f7f9fc; --surface:#ffffff; --surface2:#f0f4fa; --fg:#0f172a; --muted:#5b6b82; --line:rgba(190,204,228,.65);
  --accent:#0062FF; --accent-soft:#edf3ff; --btn:#0062FF; --on-accent:#ffffff; --sage:#475569; --sage-soft:#f1f5f9;
  --bad:#EF4444; --bad-soft:#fef2f2; --warn:#F59E0B; --warn-soft:#fffaeb; --ok:#10B981; --ok-soft:#ecfdf5;
  --ok-ink:#047857; --warn-ink:#a15c07; --bad-ink:#c81e1e; --tint:#f5f8ff; --crit-tint:#fff6f6;
  --glass:rgba(255,255,255,.72); --fig-line:#cbd5e1; --mark:#0f172a; --on-mark:#ffffff;
  --shadow:0 1px 2px rgba(15,23,42,.04); --shadow-lg:0 12px 32px -12px rgba(15,23,42,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05070b; --surface:#0e1219; --surface2:#171c26; --fg:#f2f4f8; --muted:#9aa6b8; --line:rgba(58,70,92,.7);
  --accent:#3B82F6; --accent-soft:#0e1a33; --btn:#0062FF; --on-accent:#ffffff; --sage:#a1a1aa; --sage-soft:#161b24;
  --bad:#EF4444; --bad-soft:#2a1215; --warn:#F59E0B; --warn-soft:#261b07; --ok:#10B981; --ok-soft:#062219;
  --ok-ink:#34d399; --warn-ink:#fbbf24; --bad-ink:#f87171; --tint:#0d1525; --crit-tint:#1e0e10;
  --glass:rgba(17,17,19,.72); --fig-line:#3f3f46; --mark:#f4f4f5; --on-mark:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 16px 40px -12px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05070b; --surface:#0e1219; --surface2:#171c26; --fg:#f2f4f8; --muted:#9aa6b8; --line:rgba(58,70,92,.7);
  --accent:#3B82F6; --accent-soft:#0e1a33; --btn:#0062FF; --on-accent:#ffffff; --sage:#a1a1aa; --sage-soft:#161b24;
  --bad:#EF4444; --bad-soft:#2a1215; --warn:#F59E0B; --warn-soft:#261b07; --ok:#10B981; --ok-soft:#062219;
  --ok-ink:#34d399; --warn-ink:#fbbf24; --bad-ink:#f87171; --tint:#0d1525; --crit-tint:#1e0e10;
  --glass:rgba(17,17,19,.72); --fig-line:#3f3f46; --mark:#f4f4f5; --on-mark:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 16px 40px -12px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16.5px/1.6 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .35s var(--ease),color .35s var(--ease)}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.022em;text-wrap:balance;font-weight:600;overflow-wrap:break-word;hyphens:auto}
p{margin:0 0 .9em}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* Gerüst */
.shell{min-height:100vh;display:block}
.side{display:none}
.main{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-bottom:120px}
.wrap{max-width:840px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.topbar .t{flex:1;min-width:0;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.topbar .t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);transition:transform .2s var(--ease),background .2s}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:20px;height:20px}
.switch{position:relative;width:62px;height:34px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);padding:0;flex-shrink:0;transition:background .3s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);display:grid;place-items:center;transition:transform .45s var(--ease),background .3s;color:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(28px)}
.switch svg{width:15px;height:15px}

/* Tab-Bar */
.tabbar{position:fixed;z-index:55;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border:1px solid var(--line);box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:8px 10px 6px;border:0;border-radius:20px;background:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.01em;transition:color .25s,background .25s}
.tab svg{width:24px;height:24px;transition:transform .35s var(--ease)}
.tab[aria-current="page"],.tab[aria-pressed="true"]{color:var(--fg);background:var(--surface2)}.side .tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
@media (min-width:960px){
  .side{display:flex;flex-direction:column;gap:6px;position:fixed;inset:0 auto 0 0;width:264px;padding:calc(28px + env(safe-area-inset-top,0px)) 16px 24px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);z-index:40}
  .side .brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
  .side .brand b{display:block;font-size:17px;letter-spacing:-.02em;line-height:1.15}
  .side .brand span{font-size:12.5px;color:var(--muted)}
  .side .tab{flex-direction:row;gap:12px;font-size:15.5px;padding:11px 14px;min-width:0;border-radius:14px;text-align:left}
  .side .foot{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 10px;line-height:1.45}
  .tabbar{display:none}
  .main{margin-left:264px;padding-bottom:64px}
}
.logo{width:40px;height:40px;border-radius:12px;background:var(--mark);display:grid;place-items:center;color:var(--on-mark);flex-shrink:0}
.logo svg{width:22px;height:22px}

/* Bausteine */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,4vw,32px);min-width:0;overflow-wrap:break-word;hyphens:auto}
.card+.card,.stack>*+*{margin-top:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);overflow-wrap:break-word}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;max-width:100%;padding:11px 20px;border-radius:14px;border:0;background:var(--btn);color:var(--on-accent);font-weight:600;font-size:15.5px;line-height:1.25;letter-spacing:-.01em;text-align:center;white-space:normal;transition:transform .2s var(--ease),background .2s,opacity .2s}
.btn:hover{background:color-mix(in srgb,var(--btn) 88%,#000)}.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--surface2);color:var(--fg)}.btn.ghost:hover{background:color-mix(in srgb,var(--surface2) 90%,var(--fg))}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14.5px;border-radius:12px}
.btn svg{width:18px;height:18px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--surface2);color:var(--muted);font-size:12.5px;font-weight:550;max-width:100%;white-space:normal;line-height:1.35}
.chip.blue{background:var(--accent-soft);color:var(--accent)}.chip.sage{background:var(--sage-soft);color:var(--sage)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .8s var(--ease)}
.page-in{animation:pin .55s var(--ease) both}
@keyframes pin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.35)}30%{transform:scale(1)}}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}

/* Onboarding */
.onb{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:32px}
.onb h1{font-size:clamp(32px,6.5vw,52px);letter-spacing:-.035em;font-weight:650}
.onb h1 em{font-style:normal;color:var(--muted)}
.onb .lead{font-size:clamp(17px,2.6vw,21px);color:var(--muted);max-width:34em}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:650;font-size:14px}
.input{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:17px;max-width:420px}
.input:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.yearcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:24px;min-width:0;display:flex;flex-direction:column;gap:6px;transition:transform .35s var(--ease),border-color .2s,box-shadow .35s;box-shadow:var(--shadow)}
.yearcard:hover{border-color:color-mix(in srgb,var(--fg) 25%,var(--line))}
.yearcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.yearcard .n{font-size:40px;font-weight:600;letter-spacing:-.04em;color:var(--fg);line-height:1}
.yearcard b{font-size:18px}.yearcard span{color:var(--muted);font-size:14.5px}

/* Home */
.hello{padding-top:28px}
.hello h1{font-size:clamp(28px,5.5vw,40px);letter-spacing:-.032em;font-weight:650}
.hello p{color:var(--muted);margin-top:6px;font-size:17.5px}
.resume{display:grid;gap:22px;grid-template-columns:1fr;overflow:hidden;position:relative}.resume>*{min-width:0}
.resume .fig{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.resume .fig svg{display:block;width:100%;height:auto}
@media (min-width:720px){.resume{grid-template-columns:1.1fr 1fr;align-items:center}}
.resume h2{font-size:clamp(22px,3.4vw,28px);margin:6px 0 10px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 12px}
.sec h2{font-size:22px;letter-spacing:-.025em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mod{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);transition:border-color .25s,transform .4s var(--ease);min-width:0;overflow:hidden;overflow-wrap:break-word;hyphens:auto}
.mod:hover{border-color:color-mix(in srgb,var(--fg) 22%,var(--line))}.mod:active{transform:scale(.99)}
.mod h3{font-size:17.5px;letter-spacing:-.02em;line-height:1.28;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mod .sub{color:var(--muted);font-size:14.5px;line-height:1.45}
.mod .meta{display:flex;gap:6px;flex-wrap:wrap}
.cast{display:flex}.cast svg{width:34px;height:34px;border-radius:50%;margin-left:-8px;border:2px solid var(--surface);background:var(--surface2)}.cast svg:first-child{margin-left:0}
.ring{position:relative;width:46px;height:46px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:var(--surface2)}.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .9s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.ring.big{width:132px;height:132px}.ring.big circle{stroke-width:9}.ring.big b{font-size:30px;letter-spacing:-.03em}
.teaser{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;margin-inline:-2px}
.tz{flex:0 0 min(80%,280px);scroll-snap-align:start;text-align:left;border-radius:20px;padding:20px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;min-height:156px;min-width:0;overflow:hidden;overflow-wrap:break-word;hyphens:auto}.tz .cast svg{width:30px;height:30px}

.tz b{font-size:16px;line-height:1.3;letter-spacing:-.01em;font-weight:600}.tz span{font-size:13px;color:var(--muted)}

/* Lernstrecke */
.seg{display:flex;gap:4px;margin:14px 0 0}
.seg i{flex:1;height:5px;border-radius:9px;background:var(--surface2);transition:background .4s}
.seg i.on{background:var(--accent)}.seg i.cur{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lh{padding:22px 0 8px}
.lh h1{font-size:clamp(25px,4.6vw,34px);letter-spacing:-.03em;font-weight:650}
.lh .goal{color:var(--muted);margin-top:8px;font-size:17px}
.block{margin-top:16px}
.klabel{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.klabel svg{width:15px;height:15px}
.klabel.deep{color:var(--accent)}
.prose{max-width:68ch}
.prose h4{font-size:17px;margin:1.2em 0 .4em}
.prose ul,.prose ol{padding-left:1.25em;margin:0 0 1em}.prose li{margin:.3em 0}
.prose .src{font-size:13px;color:var(--muted);line-height:1.5}
.prose table{border-collapse:collapse;width:100%;font-size:14.5px;display:block;overflow-x:auto}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.prose figure,.card figure{margin:0 0 16px}
.prose svg.illu,figure svg.illu{display:block;width:100%;height:auto;border-radius:16px}
figcaption{font-size:13.5px;color:var(--muted);margin-top:8px}
.scene{display:flex;gap:14px;align-items:flex-start}
.scene .av{flex:0 0 56px}.scene .av svg{width:56px;height:56px;border-radius:50%}
.scene .bubble{background:var(--surface2);border-radius:18px 18px 18px 6px;padding:14px 18px;min-width:0;overflow-wrap:break-word;hyphens:auto}
.scene .who{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.merke{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:16px;padding:18px 22px;min-width:0;overflow-wrap:break-word}
.merke h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.challenge{background:var(--warn-soft);border-radius:16px;padding:18px 22px;min-width:0;overflow-wrap:break-word}
.challenge h3{font-size:16px;color:var(--warn-ink);margin-bottom:6px}
.casegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.casegrid div{background:var(--surface2);border-radius:14px;padding:10px 14px;min-width:0;overflow-wrap:break-word;hyphens:auto}.casegrid dt{font-size:12px;color:var(--muted);font-weight:650}.casegrid dd{margin:2px 0 0;font-weight:600}
.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:28px;flex-wrap:wrap}
.skip{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px}

/* Aufgaben */
.q{font-weight:600;font-size:18px;overflow-wrap:break-word;hyphens:auto;letter-spacing:-.015em;margin:2px 0 14px;line-height:1.35}
.tag{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-width:0;overflow-wrap:break-word;hyphens:auto;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 16px;transition:border-color .2s,background .2s,transform .2s var(--ease)}
.opt:hover:not([disabled]){border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;transition:all .2s}
.opt.multi .dot{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.opt.ok .dot{background:var(--ok);border-color:var(--ok)}.opt.bad .dot{background:var(--bad);border-color:var(--bad)}
.opt .dot svg{width:12px;height:12px;color:#fff;opacity:0}.opt[aria-pressed="true"] .dot svg,.opt.ok .dot svg,.opt.bad .dot svg{opacity:1}
.opt[disabled]{cursor:default}
.fb{margin-top:6px;font-size:14.5px;color:var(--muted);line-height:1.5;animation:fadeUp .4s var(--ease)}
.result{display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:16px;animation:fadeUp .45s var(--ease);overflow-wrap:break-word}
.result.ok{background:var(--ok-soft)}.result.part{background:var(--warn-soft)}.result.bad{background:var(--bad-soft)}
.result .badge{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;animation:pop .6s var(--ease)}
.result.ok .badge{background:var(--ok)}.result.part .badge{background:var(--warn)}.result.bad .badge{background:var(--bad)}
.result b{display:block}
.result .pts{font-variant-numeric:tabular-nums;font-weight:700}
.sel{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;max-width:100%;min-width:0;font-size:15px;text-overflow:ellipsis}
.sel.ok{border-color:var(--ok);background:var(--ok-soft)}.sel.bad{border-color:var(--bad);background:var(--bad-soft)}
.mrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.mrow:first-of-type{border-top:0}.mrow>span{flex:1 1 260px;min-width:0;overflow-wrap:break-word;hyphens:auto}.mrow .sel{flex:0 1 auto;width:auto}@media (max-width:600px){.mrow .sel{width:100%;flex-basis:100%}}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.oitem{display:flex;gap:10px;align-items:center;min-width:0;overflow-wrap:break-word;hyphens:auto;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 10px 10px 14px;transition:transform .3s var(--ease),border-color .2s}
.oitem.drag{opacity:.4}.oitem.ok{border-color:var(--ok);background:var(--ok-soft)}.oitem.bad{border-color:var(--bad);background:var(--bad-soft)}
.oitem .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:13px;font-weight:700}
.oitem .tx{flex:1;min-width:0}
.oitem .mv{display:flex;flex-direction:column;gap:2px}
.oitem .mv button{width:32px;height:22px;border:0;border-radius:7px;background:var(--surface2);display:grid;place-items:center;color:var(--fg)}.oitem .mv svg{width:14px;height:14px}
.prio-end{display:flex;justify-content:space-between;font-size:12.5px;font-weight:650;color:var(--muted);margin:0 4px 8px}
.cloze{line-height:2.4;font-size:17px}
.cloze .sel{height:38px;margin:2px 3px;font-weight:550;max-width:100%}
.tnode{border-left:3px solid var(--accent);padding-left:16px;margin:0 0 18px;animation:fadeUp .45s var(--ease)}
.tnode h4{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.flip{perspective:1000px;min-height:150px;border:0;background:none;padding:0;text-align:center;font-size:16px}
.flip>div{position:relative;width:100%;height:100%;min-height:150px;transition:transform .7s var(--ease);transform-style:preserve-3d}
.flip.on>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);overflow:auto}
.flip .f{background:var(--surface);font-weight:600;font-size:17px;overflow-wrap:break-word;hyphens:auto}.flip .b{background:var(--surface2);overflow-wrap:break-word;hyphens:auto;transform:rotateY(180deg);font-size:14.5px;line-height:1.5;text-align:left}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cards .flip{min-height:190px}.cards .flip>div{min-height:190px}
textarea.input{height:auto;min-height:130px;padding:14px 16px;width:100%;max-width:none;resize:vertical;line-height:1.5}
.model{margin-top:14px;background:var(--surface2);overflow-wrap:break-word;border-radius:18px;padding:16px 18px;animation:fadeUp .45s var(--ease)}
.model h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.qprog{display:flex;gap:6px;margin-bottom:14px}.qprog i{flex:1;height:4px;border-radius:9px;background:var(--surface2)}.qprog i.on{background:var(--accent)}.qprog i.ok{background:var(--ok)}.qprog i.bad{background:var(--bad)}
.sumring{display:flex;gap:20px;align-items:center;flex-wrap:wrap}

/* Glossar */
.gl{text-decoration:underline dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;cursor:help;border-radius:4px}
.gl:hover,.gl:focus-visible{background:var(--accent-soft)}
.pop{position:fixed;z-index:90;width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow-lg);animation:pop .3s var(--ease) both;transform-origin:top left}
.pop h4{font-size:16px;margin-bottom:4px}.pop p{font-size:14.5px;line-height:1.5;margin:0 0 8px}.pop small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}

/* Drawer / Sheets */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .3s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;z-index:75;right:0;top:0;bottom:0;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 16px;animation:slideIn .5s var(--ease) both}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:640px){.drawer{top:auto;height:90vh;width:100%;border-radius:28px 28px 0 0;animation:slideUp .5s var(--ease) both}@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}}
.dh{display:flex;gap:14px;align-items:center;margin-bottom:16px}.dh .av svg{width:60px;height:60px;border-radius:50%}
.dh h2{font-size:21px}.dh p{margin:0;color:var(--muted);font-size:14px}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vt{background:var(--surface2);border-radius:16px;padding:10px 12px;min-width:0;animation:flash 1.2s ease-out}
.vt small{display:block;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.vt b{font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.vt i{font-style:normal;font-size:12px;color:var(--muted);margin-left:2px;white-space:nowrap}
.vt.alert b{color:var(--bad-ink)}
.live{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dl{margin:0}.dl div{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}.dl dd{overflow-wrap:break-word;hyphens:auto}.dl dt{flex:0 0 108px;overflow-wrap:break-word;color:var(--muted);font-weight:600}.dl dd{margin:0;flex:1;min-width:0}
.dcard{min-width:0;overflow-wrap:break-word;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-top:12px}
.dcard h3{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.station{display:flex;gap:12px;width:100%;align-items:center;text-align:left;border:0;background:none;padding:12px 4px;border-top:1px solid var(--line);border-radius:0}
.station:first-child{border-top:0}
.station .ck{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.station .ck.on{background:var(--ok);border-color:var(--ok)}.station .ck svg{width:14px;height:14px}
.station>div{min-width:0;overflow-wrap:break-word;hyphens:auto}.station b{display:block;font-size:15.5px;letter-spacing:-.01em;line-height:1.3}.station span{font-size:13px;color:var(--muted)}

/* Fortschritt */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{min-width:0;overflow-wrap:break-word;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px}.stat b{display:block;font-size:30px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--muted)}

.mp .h{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:15.5px}.mp .h>*{min-width:0;overflow-wrap:break-word}.mp .h span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bd{min-width:0;overflow-wrap:break-word;hyphens:auto;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}

.fx{display:block;width:100%;height:auto;font-family:var(--font);overflow:visible}
.fx .b{fill:var(--surface);stroke:var(--fig-line);stroke-width:1.25}
.fx .bs{fill:var(--surface2);stroke:none}
.fx .ba{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.25}
.fx .acs{fill:var(--accent);stroke:none}
.fx .ring{fill:none;stroke:var(--fig-line);stroke-width:1.25;stroke-dasharray:4 6}
.fx .l{fill:none;stroke:var(--fig-line);stroke-width:1.5}
.fx .la{fill:none;stroke:var(--accent);stroke-width:1.75}
.fx .t{fill:var(--fg)}.fx .tm{fill:var(--muted)}.fx .ta{fill:var(--accent)}.fx .ton{fill:#fff}

figure .fx,.resume .fig .fx{padding:8px}
.resume .fig{border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}

.hero-thumb{border-radius:14px;overflow:hidden;background:var(--surface2);aspect-ratio:16/9;display:grid;place-items:center}
.hero-thumb svg{width:100%;height:100%;object-fit:contain}

/* Splash */
.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);transition:opacity .6s var(--ease),visibility .6s}

.splash span{font-size:15px;color:var(--muted);animation:fadeBlur .9s .45s var(--ease) both}

@keyframes fadeBlur{from{opacity:0;filter:blur(8px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}

:root[data-theme="dark"] svg.illu [fill="#fff1d6"]:not(.avatar-svg *){fill:#222226}
:root[data-theme="dark"] svg.illu [stroke="#fff1d6"]:not(.avatar-svg *){stroke:#222226}
:root[data-theme="dark"] svg.illu [fill="#ffe1df"]:not(.avatar-svg *){fill:#2a1211}
:root[data-theme="dark"] svg.illu [stroke="#ffe1df"]:not(.avatar-svg *){stroke:#2a1211}
:root[data-theme="dark"] svg.illu [fill="#ddf4e4"]:not(.avatar-svg *){fill:#0f2017}
:root[data-theme="dark"] svg.illu [stroke="#ddf4e4"]:not(.avatar-svg *){stroke:#0f2017}
:root[data-theme="dark"] svg.illu :not(text)[fill="#f9f9fb"]:not(.avatar-svg *){fill:#18181b}
:root[data-theme="dark"] svg.illu [stroke="#f9f9fb"]:not(.avatar-svg *){stroke:#18181b}
:root[data-theme="dark"] svg.illu :not(text)[fill="#f2f2f7"]:not(.avatar-svg *){fill:#1f1f23}
:root[data-theme="dark"] svg.illu [stroke="#f2f2f7"]:not(.avatar-svg *){stroke:#1f1f23}
:root[data-theme="dark"] svg.illu :not(text)[fill="#e5e5ea"]:not(.avatar-svg *){fill:#3f3f46}
:root[data-theme="dark"] svg.illu [stroke="#e5e5ea"]:not(.avatar-svg *){stroke:#3f3f46}
:root[data-theme="dark"] svg.illu :not(text)[fill="#ffffff"]:not(.avatar-svg *){fill:#18181b}
:root[data-theme="dark"] svg.illu [stroke="#ffffff"]:not(.avatar-svg *){stroke:#18181b}
:root[data-theme="dark"] svg.illu [stroke="#1d1d1f"]:not(.avatar-svg *){stroke:#d4d4d8}
:root[data-theme="dark"] svg.illu [fill="#1d1d1f"]:not(.avatar-svg *){fill:#d4d4d8}
:root[data-theme="dark"] svg.illu text[fill="#1d1d1f"]{fill:#f4f4f5}
.avatar-svg [stroke-width="3"]{stroke-width:2}.avatar-svg [stroke-width="2.5"]{stroke-width:1.8}

/* Logo */
.logo-svg{display:grid;place-items:center;width:72%;height:72%}.logo-svg svg{width:100%;height:100%}
.splash .mk .logo-svg{width:58%;height:58%}

/* Jahresabschnitte */
.yearsec{padding-top:6px}.yearsec+.yearsec{margin-top:18px;border-top:1px solid var(--line)}

/* Laborwerte */
.labwrap{overflow-x:auto;margin:0 -2px}
table.lab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.lab th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.lab td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:break-word}
table.lab td small{color:var(--muted);font-size:12px}
table.lab tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-weight:600;background:var(--surface2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}.pill.crit{background:var(--bad-soft);color:var(--bad-ink)}
.tr{font-style:normal;font-size:12px;opacity:.85}
@media (max-width:480px){.hide-s{display:none}}
.vt.f-warn b{color:var(--warn-ink)}.vt.f-crit b{color:var(--bad-ink)}.vt.f-ok b{color:var(--fg)}
.vt .tr{margin-left:3px;color:var(--muted)}

/* Laborverlauf */
.lsline{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.lsdot{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.lsdot.cur{background:var(--accent-soft);color:var(--accent)}.lsdot.ok{background:var(--ok-soft);color:var(--ok-ink)}.lsdot.bad{background:var(--bad-soft);color:var(--bad-ink)}
.lspanel{border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 18px;background:var(--bg)}
.lshead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.lsvit{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:12px}
.lsvit .vt{animation:none;transition:background .4s}

/* Anmeldung */
.login{gap:24px}
.loginform{display:flex;flex-direction:column;gap:16px;max-width:480px}
.loginform .input{max-width:none;width:100%}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:3px}
.seg2 button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;color:var(--muted);font-size:14.5px}
.seg2 button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.msg{margin:0;padding:10px 14px;border-radius:12px;font-size:14px;overflow-wrap:break-word}
.msg.err{background:var(--bad-soft);color:var(--bad-ink)}.msg.okm{background:var(--ok-soft);color:var(--ok-ink)}
.syncline{display:flex;align-items:flex-start;gap:8px;margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.4;overflow-wrap:break-word}
.syncline i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:5px;background:var(--muted)}
.syncline.s-ok i{background:var(--ok)}.syncline.s-saving i{background:var(--warn)}.syncline.s-err i{background:var(--bad)}
.side .foot .syncline{font-size:12px}

/* Pflegebericht */
.dokusheet{border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:14px;margin:12px 0}
.dokuhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.dokutext{width:100%;min-height:150px;border:0;background:transparent;resize:vertical;font:15px/1.65 var(--mono,ui-monospace),monospace;color:var(--fg);outline:none;background-image:repeating-linear-gradient(transparent,transparent 24px,var(--line) 24px,var(--line) 25px);background-attachment:local;line-height:25px;padding:0 2px}
.dokugrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:6px 0 16px}
.dokugrid h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:flex-start;color:var(--muted);overflow-wrap:break-word}
.checks li i{font-style:normal;flex:0 0 18px;font-weight:700}
.checks li.ok{color:var(--ok-ink)}.checks li.warn{color:var(--warn-ink)}
.berichte{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.berichte li{border-left:2px solid var(--line);padding-left:10px}.berichte small{color:var(--muted);font-size:12px}.berichte p{margin:2px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:break-word}
/* Vorlesen */
.readbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600;flex-shrink:0}
.readbtn svg{width:14px;height:14px}.readbtn.on{color:var(--accent);border-color:var(--accent)}
/* Profil */
.avatar{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--surface2);flex-shrink:0}
.avatar svg,.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.ini{background:var(--accent-soft);color:var(--accent);font-weight:650}
.avbtn{border:0;background:none;padding:0;border-radius:50%;flex-shrink:0}
.avbtn:focus-visible{outline-offset:3px}
.sideprof{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:10px;border-radius:14px;margin-top:auto}
.sideprof:hover{background:var(--surface2)}.sideprof b{display:block;font-size:14px}.sideprof small{color:var(--muted);font-size:12px}
.side .foot{margin-top:4px}
.profprev{display:grid;place-items:center;margin:4px 0 14px}
.figed h3{margin:14px 0 6px}.figed h3:first-child{margin-top:0}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);border-color:transparent}
.sliders{display:flex;flex-direction:column;gap:8px;margin-top:12px}.sliders label{display:grid;grid-template-columns:90px 1fr;align-items:center;font-size:13.5px;color:var(--muted);gap:8px}
/* Training */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:2px;margin-top:6px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px}
.boxes div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}.boxes b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.boxes span{font-size:12px;color:var(--muted)}
.flip.big{width:100%;min-height:230px}.flip.big>div{min-height:230px}.flip.big .f{font-size:21px}.flip.big .b{font-size:16px}
.exlist,.review{margin:8px 0 14px;padding-left:1.2em}.exlist{list-style:none;padding:0}.exlist li{display:flex;gap:14px;padding:6px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.review li{margin:10px 0;overflow-wrap:break-word}.review li.bad{color:var(--fg)}.review li.ok .fb{color:var(--ok-ink)}
.lex{margin:0}.lex div{padding:10px 0;border-top:1px solid var(--line)}.lex dt{font-weight:650}.lex dd{margin:2px 0 0;font-size:14.5px;overflow-wrap:break-word}.lex small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pfgroup{margin-top:16px}.pfgroup h4{font-size:16px;margin-bottom:6px}
.pfentry{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:8px;overflow-wrap:break-word}.pfentry b{display:block;font-size:14.5px;margin:2px 0 4px}.pfentry p{margin:0;font-size:14px;white-space:pre-wrap}
@media (max-width:420px){.tab{min-width:52px;padding:8px 4px 6px;font-size:10.5px}}

/* ===== Signalfarben, Tints ===== */
.ring.done .fg{stroke:var(--ok)}
.bar i{background:var(--accent)}
.sent{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--ok-soft);color:var(--ok-ink);font-weight:550;font-size:14.5px;margin-top:4px;animation:fadeUp .4s var(--ease)}
.sent svg{width:18px;height:18px;flex-shrink:0}
.merke{background:var(--tint)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}.fchips .chip{border:0;min-height:32px;cursor:pointer}
.chip.okc{background:var(--ok-soft);color:var(--ok-ink)}
.skip.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;text-decoration:none;font-weight:600}.skip.back svg{width:16px;height:16px}

/* ===== Simulation: Rahmen ===== */
.simwrap{background:linear-gradient(180deg,var(--tint),var(--surface) 140px)}
.simx{min-width:0}
.simhead{display:flex;gap:14px;align-items:center;margin-bottom:14px}.simhead h3{margin:4px 0 0;font-size:21px;letter-spacing:-.02em}
.simic{flex:0 0 46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.simic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.simintro p{margin:0 0 12px;line-height:1.55}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:8px}.goals li{display:flex;gap:10px;align-items:flex-start;font-size:15px}.goals svg{width:16px;height:16px;flex-shrink:0;margin-top:3px;color:var(--ok)}
.simbody{display:flex;flex-direction:column;gap:14px;min-width:0}
.simbody.critmode{background:var(--crit-tint);margin:-8px;padding:8px;border-radius:18px;transition:background .6s}
.ssteps{list-style:none;margin:0;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ssteps li{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:99px;background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0}
.ssteps i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--surface);font-size:11.5px}
.ssteps li.cur{background:var(--accent-soft);color:var(--accent)}.ssteps li.cur i{background:var(--accent);color:#fff}
.ssteps li.done{color:var(--ok-ink)}.ssteps li.done i{background:var(--ok);color:#fff}.ssteps svg{width:12px;height:12px}
@media (max-width:640px){.ssteps li:not(.cur) span{display:none}.ssteps li:not(.cur){padding:5px}}
.phead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.phead.crit{background:var(--crit-tint);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.pav{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.phead.crit .pav{background:var(--bad)}
.phead b{display:block;font-size:15.5px}.phead span{font-size:13px;color:var(--muted)}
.pbadges{display:flex;gap:6px;flex-wrap:wrap}
.pb{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.pb.crit{background:var(--bad);color:#fff}.pb.warn{background:var(--warn-soft);color:var(--warn-ink)}.pb.info{background:var(--surface);color:var(--accent)}.pb.ok{background:var(--ok-soft);color:var(--ok-ink)}
.qstep{display:flex;flex-direction:column;gap:12px;min-width:0}
.sq{margin:0;font-size:18px;line-height:1.35;letter-spacing:-.01em}
.hint{margin:-6px 0 0;font-size:13.5px}.phint{margin:0;font-size:14px;color:var(--muted)}
.snav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.why{border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.55;background:var(--tint);border-left:3px solid var(--accent);animation:fadeUp .45s var(--ease)}
.why b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.why.ok{background:var(--ok-soft);border-color:var(--ok)}.why.ok b{color:var(--ok-ink)}
.why.warn{background:var(--warn-soft);border-color:var(--warn)}.why.warn b{color:var(--warn-ink)}
.why.crit{background:var(--bad-soft);border-color:var(--bad)}.why.crit b{color:var(--bad-ink)}
.opt.part{border-color:var(--warn);background:var(--warn-soft)}.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.split{display:grid;grid-template-columns:1fr;gap:14px}@media (min-width:900px){.split{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start}}
.sheet{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.sheethead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:9px 14px;background:var(--surface2);font-size:12.5px;font-weight:650;color:var(--muted)}
.kv{margin:0;padding:6px 14px 10px}.kv div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}.kv div:last-child{border:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}.kv dd.lo{color:var(--bad-ink)}
.bubble2{background:var(--surface2);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:15px;line-height:1.5}.bubble2 b{display:block;font-size:12.5px;color:var(--accent);margin-bottom:3px}
.signed{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface2)}
.signed svg{width:52px;height:52px;flex-shrink:0;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.signed circle{stroke:var(--line)}.signed path{stroke:var(--bad);stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .2s var(--ease) forwards}
.signed.on{background:var(--ok-soft)}.signed.on circle{stroke:var(--ok);stroke-dasharray:151;stroke-dashoffset:151;animation:draw .7s var(--ease) forwards}.signed.on path{stroke:var(--ok)}
.signed b{display:block}.signed span{font-size:13.5px;color:var(--muted)}
@keyframes draw{to{stroke-dashoffset:0}}
.simend{display:flex;gap:22px;align-items:center;flex-wrap:wrap}.simend h3{margin:0 0 4px;font-size:21px}.simend>div:last-child{flex:1;min-width:220px}
.endnotes{margin:10px 0 0;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.arc{position:relative;width:180px;flex-shrink:0}.arc svg{width:100%;display:block}
.arc path{fill:none;stroke-width:12;stroke-linecap:round}.arc .bg{stroke:var(--surface2)}.arc .fg{transition:stroke-dashoffset 1.2s var(--ease)}
.arc.ok .fg{stroke:var(--ok)}.arc.warn .fg{stroke:var(--warn)}.arc.crit .fg{stroke:var(--bad)}
.arc b{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:30px;letter-spacing:-.03em}
.stepper{display:flex;flex-direction:column;gap:5px;min-width:0}.stepper label{font-size:13px;font-weight:600;color:var(--muted)}
.stepper>div{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--fg);flex-shrink:0}
.stepper input{width:90px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:center;font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;min-width:0}
.stepper input:focus{outline:2px solid var(--accent);outline-offset:1px}.stepper em{font-style:normal;color:var(--muted);font-size:14px}

/* Sortierliste */
.sortable{display:flex;flex-direction:column;gap:10px}
.srt{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:transform .22s var(--ease),box-shadow .2s;min-width:0}
.srt.drag{transition:none;z-index:3;box-shadow:var(--shadow-lg);border-color:var(--accent)}
.grip{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;cursor:grab;touch-action:none;color:var(--muted);flex-shrink:0;border-right:1px solid var(--line)}
.grip.off{cursor:default}.grip svg{width:10px;height:16px;fill:currentColor}
.rank{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--fg)}
.srtbody{flex:1;min-width:0;padding:12px 14px;font-size:15px}
.srtbtns{display:flex;flex-direction:column;justify-content:center;padding:4px;gap:2px}.srtbtns button{width:30px;height:26px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center}.srtbtns button:hover{background:var(--surface2)}.srtbtns svg{width:16px;height:16px}
.srtbtns button[disabled]{opacity:.25}
.srt.lv-crit{border-left:4px solid var(--bad);background:var(--crit-tint)}.srt.lv-warn{border-left:4px solid var(--warn)}.srt.lv-info{border-left:4px solid var(--accent)}.srt.lv-ok{border-left:4px solid var(--ok)}

/* 6-R */
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:14px;border-radius:18px;background:var(--surface2)}
.amp{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px 12px;text-align:center;transition:all .2s var(--ease)}
.amp svg{width:30px;height:60px}.amp .ab{fill:var(--tint);stroke:var(--fig-line);stroke-width:1.5}.amp .al{stroke:var(--fig-line);stroke-width:1.5}
.amp b{font-size:13.5px}.amp span{font-size:12.5px;color:var(--muted)}.amp em{font-style:normal;font-size:11px;font-weight:700;color:var(--bad-ink);text-transform:uppercase;letter-spacing:.05em}
.amp.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.calc{display:flex;flex-wrap:wrap;gap:8px}.calc span{padding:6px 12px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.syr{width:100%;max-width:420px}.syr .sb{fill:var(--surface);stroke:var(--fig-line);stroke-width:1.5}.syr .sf{fill:color-mix(in srgb,var(--accent) 35%,transparent)}.syr .sl{stroke:var(--fig-line);stroke-width:1.2}.syr .sp{fill:var(--fg)}
.range{width:100%;max-width:420px;accent-color:var(--accent)}
.readout{display:flex;gap:12px;align-items:baseline}.readout b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.readout span{color:var(--muted)}

/* SBAR: Monitor und Telefon */
.monitor{background:#0b1220;color:#e2e8f0;border-radius:18px;padding:14px;border:1px solid #1e293b}
.monitor.crit{box-shadow:inset 0 0 0 2px rgba(239,68,68,.55)}
.mline{height:60px;overflow:hidden}.mline svg{width:200%;height:60px;animation:ecgScroll 2.6s linear infinite}
.ecg{fill:none;stroke:#10B981;stroke-width:2;stroke-linejoin:round}.monitor.crit .ecg{animation-duration:3.6s}
@keyframes ecgScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.mvals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.mv{background:#111a2e;border-radius:12px;padding:8px 10px}.mv small{display:block;font-size:11px;color:#94a3b8;letter-spacing:.06em}.mv b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#86efac}.mv i{font-style:normal;font-size:12px;color:#94a3b8;margin-left:4px}
.mv.alarm b{color:#fca5a5;animation:blinkA 1.2s steps(2) infinite}@keyframes blinkA{50%{opacity:.45}}
.mfoot{margin-top:8px;font-size:12.5px;color:#94a3b8}
.phone{border:1px solid var(--line);border-radius:26px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:background .5s,border-color .5s}
.phone.ok{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}.phone.warn{border-color:var(--warn)}
.phtop{display:flex;justify-content:space-between;font-size:13px;font-weight:650;padding:2px 6px 6px;border-bottom:1px solid var(--line)}
.slot{display:flex;gap:10px;align-items:flex-start;border:1.5px dashed var(--line);border-radius:14px;padding:10px;min-height:58px;transition:all .2s;cursor:pointer}
.slot.full{border-style:solid;background:var(--surface)}.slot.ok{border-color:var(--ok);background:var(--ok-soft)}.slot.warn{border-color:var(--warn);background:var(--warn-soft)}
.slot .sl{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:750;flex-shrink:0}
.slot small{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.slot p{margin:2px 0 0;font-size:14.5px;line-height:1.45}.slot p.ph{color:var(--muted);font-style:italic}
.slot em{display:block;font-style:normal;font-size:13px;color:var(--warn-ink);margin-top:4px}
.slot .x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:8px;flex-shrink:0}.slot .x svg{width:14px;height:14px}
.pool{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.dcard2{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.45;cursor:grab;touch-action:none;user-select:none;position:relative;transition:box-shadow .2s,border-color .2s}
.dcard2.lift{box-shadow:var(--shadow-lg);cursor:grabbing}.dcard2.picked{border-color:var(--accent);background:var(--accent-soft)}

/* Triage */
.dash{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:var(--tint);border:1px solid var(--line)}
.dashtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--muted)}
.timer svg{width:24px;height:24px;transform:rotate(-90deg)}.timer circle{fill:none;stroke-width:4}.timer .tb{stroke:var(--surface2)}.timer .tf{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.timer.low{color:var(--warn-ink)}.timer.low .tf{stroke:var(--warn)}
.sig b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}.sig b svg{width:16px;height:16px;fill:none;stroke:var(--accent);stroke-width:2}.sig p{margin:4px 0 0;font-size:14.5px;line-height:1.45}
.sig.popin{animation:popIn .5s var(--ease) both}.srt:nth-child(2) .popin{animation-delay:.12s}.srt:nth-child(3) .popin{animation-delay:.24s}.srt:nth-child(4) .popin{animation-delay:.36s}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.whyl{color:var(--muted);font-size:13.5px!important}.whyl em{font-style:normal;color:var(--warn-ink);font-weight:600}

/* Asepsis */
.ortable{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:var(--surface2);position:relative}
.ortable.crash{background:var(--crit-tint);animation:shake .4s}
.wound{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:10px}.wound svg{width:110px;flex-shrink:0}
.wound .skin{fill:#f2d3bd}.wound .cut{stroke:#b4473f;stroke-width:2.5}.wound .stp{stroke:#64748b;stroke-width:2}.wound .drs{fill:#fff;stroke:#cbd5e1;stroke-width:2;opacity:.94}.wound .drs.new{fill:#eef4ff;stroke:#0062FF}
.wound small{display:block;font-size:12px;color:var(--muted)}.wound b{display:block;font-size:17px}.wound span{font-size:13px;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tool{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.3;transition:all .18s var(--ease);min-width:0}
.tool svg{width:24px;height:24px;flex-shrink:0;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover:not([disabled]){border-color:var(--accent)}.tool:active{transform:scale(.97)}.tool.hit{border-color:var(--ok);background:var(--ok-soft)}
.trail{margin:0;padding-left:20px;font-size:13px;color:var(--muted);columns:2 220px}
.crashbox{display:flex;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--bad);animation:fadeUp .35s var(--ease)}
.crashbox svg{width:28px;height:28px;flex-shrink:0;fill:none;stroke:var(--bad);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crashbox b{color:var(--bad-ink)}.crashbox p{margin:4px 0 10px;font-size:14.5px;line-height:1.5}

/* Insulin */
.meter{border-radius:18px;background:#0b1220;color:#e2e8f0;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.meter small{font-size:12px;color:#94a3b8}.meter b{font-size:46px;letter-spacing:-.03em;color:#fcd34d;font-variant-numeric:tabular-nums}.meter span{font-size:13px;color:#94a3b8}
.pen{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--surface2)}.pen svg{width:100%;max-width:440px}
.pen .pb2{fill:var(--surface);stroke:var(--fig-line);stroke-width:1.5}.pen .pk{fill:var(--accent)}.pen .pn{stroke:var(--muted);stroke-width:2}.pen .pw{fill:#0b1220}.pen .pt{fill:#e2e8f0;font-size:17px;font-weight:700;font-family:var(--font)}.pen .drop{fill:var(--accent);animation:fadeUp .5s}
.penctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.penctl b{min-width:70px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.belly{position:relative;max-width:260px;margin:0 auto;width:100%}.belly svg{width:100%;display:block}
.belly .skin{fill:#f2d3bd}.belly .ax{stroke:rgba(100,116,139,.35);stroke-width:1.5;stroke-dasharray:4 4}.belly .navel{fill:none;stroke:#a77d62;stroke-width:2}
.zone{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);transition:all .2s}
.zone.used{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}.zone.lipo{border-style:dashed;border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.zone.on{background:color-mix(in srgb,var(--accent) 38%,transparent);transform:translate(-50%,-50%) scale(1.06)}.zone.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 40%,transparent)}.zone.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 35%,transparent)}
.log{margin:0;padding:8px 14px 12px;list-style:none;font-size:14px;display:grid;gap:6px}.zsel{margin:0;padding:0 14px 12px;font-size:14px}

/* Schmerz */
.nrs{display:flex;flex-direction:column;gap:6px}.nrs label{font-size:13.5px;font-weight:650}
.nrsbar{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nrsbar button{height:42px;border:0;border-radius:10px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);background:hsl(var(--h) 70% 92%);transition:transform .15s}
:root[data-theme="dark"] .nrsbar button{background:hsl(var(--h) 35% 22%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nrsbar button{background:hsl(var(--h) 35% 22%)}}
.nrsbar button.on{background:hsl(var(--h) 70% 45%)!important;color:#fff;transform:scale(1.08)}
.nrslab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:10px}
.who{display:flex;flex-direction:column;gap:8px}.whorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;background:var(--surface2)}
.whorow b{flex:1;min-width:120px}.whorow em{font-style:normal;font-size:13px;color:var(--bad-ink);font-weight:600}.whorow.ok{background:var(--ok-soft)}.whorow.bad{background:var(--bad-soft)}
.seg3{display:flex;gap:4px;background:var(--surface);padding:3px;border-radius:10px}.seg3 button{border:0;background:none;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}.seg3 button[aria-pressed="true"]{background:var(--accent);color:#fff}
.blister{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface2)}
.pills{display:grid;grid-template-columns:repeat(6,22px);gap:8px;padding:12px;border-radius:12px;background:linear-gradient(135deg,#e2e8f0,#cbd5e1)}
.pills i{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:inset 0 -2px 3px rgba(0,0,0,.12);transition:all .4s var(--ease)}.pills i.out{background:transparent;box-shadow:inset 0 0 0 2px rgba(100,116,139,.4);transform:scale(.8)}

/* Wunde */
.wgrid{display:grid;grid-template-columns:1fr;gap:14px}@media (min-width:760px){.wgrid{grid-template-columns:1.1fr 1fr;align-items:start}}
.woundart{width:100%;border-radius:18px;display:block}.woundart .wbg{fill:#f1d1bb}.woundart .wmaz{fill:#f7efe6}.woundart .wepi{fill:#f2b5a6}
.wsels{display:grid;gap:10px}.wsel{display:flex;flex-direction:column;gap:4px}.wsel label{font-size:13px;font-weight:650;color:var(--muted)}
.wsel select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font-size:15px;max-width:100%}
.wsel.ok select{border-color:var(--ok);background:var(--ok-soft)}.wsel.bad select{border-color:var(--bad);background:var(--bad-soft)}.wsel em{font-style:normal;font-size:12.5px;color:var(--bad-ink)}
.dress{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}

/* Infusion */
.drip{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}.drip svg{width:56px}
.drip .dc{fill:var(--tint);stroke:var(--fig-line);stroke-width:1.5}.drip .df{fill:color-mix(in srgb,var(--accent) 30%,transparent)}.drip .dt{stroke:var(--fig-line);stroke-width:3}.drip .dd{fill:var(--accent);opacity:0}
.drip.on .dd{animation:dripF 1.43s linear infinite}@keyframes dripF{0%{opacity:1;transform:translateY(0)}80%{opacity:1;transform:translateY(28px)}100%{opacity:0;transform:translateY(30px)}}
.pumpui{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}.pumpui.ok{border-color:var(--ok)}.pumpui.warn{border-color:var(--warn)}
.pscreen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0b1220;border-radius:14px;padding:12px}
.pscreen div{color:#e2e8f0}.pscreen small{display:block;font-size:11px;color:#94a3b8}.pscreen b{font-size:24px;font-variant-numeric:tabular-nums}.pscreen i{font-style:normal;font-size:12px;color:#94a3b8;margin-left:3px}.pscreen .ps{font-size:16px;color:#86efac}
.pumpalarm{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--warn-soft);border:1px solid var(--warn)}
.pumpalarm svg{width:26px;height:26px;fill:none;stroke:var(--warn);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:blinkA 1.2s steps(2) infinite}.pumpalarm b{display:block}.pumpalarm span{font-size:13.5px;color:var(--muted)}

/* CAM */
.cam{display:flex;flex-direction:column;gap:10px;position:relative}
.camn{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface);opacity:.5;transition:all .35s var(--ease);position:relative}
.camn.on{opacity:1}.camn.here{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.camn.yes{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}.camn.no{border-color:var(--line)}
.camh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.camh i{width:26px;height:26px;border-radius:8px;background:#64748b;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.camn.on .camh i{background:var(--accent)}.camh b{flex:1;min-width:160px}
.camo{margin:8px 0 0;font-size:14.5px;line-height:1.5;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.camor{display:none}
.camres{padding:14px;border-radius:16px;display:flex;flex-direction:column;gap:4px;animation:fadeUp .45s var(--ease)}.camres span{font-size:14.5px;line-height:1.5}
.camres.pos{background:var(--crit-tint);border:1px solid var(--bad)}.camres.pos b{color:var(--bad-ink)}.camres.neg{background:var(--ok-soft);border:1px solid var(--ok)}.camres.neg b{color:var(--ok-ink)}

/* NEWS2 */
.news{display:flex;flex-direction:column;gap:6px}
.nrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface2);flex-wrap:wrap}.nrow.ok{background:var(--ok-soft)}.nrow.bad{background:var(--bad-soft)}
.nk{flex:1;min-width:150px;display:flex;justify-content:space-between;gap:10px}.nk span{font-variant-numeric:tabular-nums;font-weight:650}
.nsc{display:flex;gap:4px}.nsc button{width:38px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;color:var(--fg)}
.nsc button[aria-pressed="true"].s0{background:var(--ok);border-color:var(--ok);color:#fff}.nsc button[aria-pressed="true"].s1{background:#fcd34d;border-color:#fcd34d;color:#3b2a00}
.nsc button[aria-pressed="true"].s2{background:var(--warn);border-color:var(--warn);color:#fff}.nsc button[aria-pressed="true"].s3{background:var(--bad);border-color:var(--bad);color:#fff}
.nrow em{font-style:normal;font-weight:700;color:var(--bad-ink);width:20px}
.nsum{display:flex;justify-content:flex-end;align-items:baseline;gap:12px;padding:6px 10px;font-weight:650}.nsum b{font-size:30px;font-variant-numeric:tabular-nums}.nsum b.warn{color:var(--warn-ink)}.nsum b.crit{color:var(--bad-ink)}

/* Bildbefunde */
.hot{display:flex;flex-direction:column;gap:10px;min-width:0}
.hotimg{position:relative;border-radius:18px;overflow:hidden;background:var(--tint);border:1px solid var(--line);cursor:crosshair;touch-action:manipulation;user-select:none}
.hart{width:100%;display:block}
.hmsg{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:12px;font-size:14.5px;font-weight:550;animation:fadeUp .3s var(--ease)}.hmsg svg{width:16px;height:16px}
.hmsg.ok{background:var(--ok-soft);color:var(--ok-ink)}.hmsg.warn{background:var(--warn-soft);color:var(--warn-ink)}.hmsg.crit{background:var(--bad-soft);color:var(--bad-ink)}
.mk{fill:none;stroke-width:3}.mk.ok{stroke:var(--ok);animation:ping .5s var(--ease)}.mk.bad path{stroke:var(--bad);stroke-width:3;stroke-linecap:round}.mk.reveal{stroke:var(--bad);stroke-dasharray:5 4}
@keyframes ping{from{r:4;opacity:0}to{opacity:1}}
.pin{cursor:pointer}.pin circle{fill:var(--accent);stroke:#fff;stroke-width:2.5}.pin text{fill:#fff;font-size:12px;font-weight:700;font-family:var(--font);pointer-events:none}.pin.on circle{fill:var(--fg)}
.hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hlist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:14.5px}.hlist button.on{border-color:var(--accent);background:var(--accent-soft)}
.hlist i{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;flex-shrink:0}
.hlist p{margin:6px 4px 4px 46px;font-size:14.5px;line-height:1.55;color:var(--muted);animation:fadeUp .3s var(--ease)}
/* Zeichenstile der Bildmodelle */
.hart .h-skin{fill:#f2d3bd;stroke:#d9ab8c;stroke-width:1.5}.hart .h-soft{fill:rgba(255,255,255,.35);stroke:none}
.hart .h-line{fill:none;stroke:rgba(120,90,70,.45);stroke-width:1.6;stroke-linecap:round}
.hart .h-cut{stroke:#9f3a33;stroke-width:3;stroke-linecap:round;fill:none}.hart .h-stp{stroke:#64748b;stroke-width:2.4;stroke-linecap:round}
.hart .h-gr0{stop-color:#e8695f;stop-opacity:.75}.hart .h-gr1{stop-color:#ef8a7a;stop-opacity:.45}.hart .h-gr2{stop-color:#f2d3bd;stop-opacity:0}
.hart .h-gape{fill:#8f2630;stroke:#6b1d24;stroke-width:1}.hart .h-pus{fill:#e3c45a;stroke:#c9a53d;stroke-width:1}
.hart .h-gauze{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.hart .h-gl{stroke:#e2e8f0;stroke-width:1.2}
.hart .h-red{fill:#e0605a;opacity:.75}.hart .h-red2{fill:#c43d3a}.hart .h-pink{fill:#f09a8e;opacity:.55}.hart .h-gloss{fill:none;stroke:#fff;stroke-width:2;opacity:.7;stroke-linecap:round}
.hart .h-wall{fill:#eef2f8}.hart .h-floor{fill:#dfe5ee}.hart .h-win{fill:#dbeafe;stroke:#94a3b8;stroke-width:2}
.hart .h-bed{fill:#fff;stroke:#94a3b8;stroke-width:2}.hart .h-pill{fill:#e0e7ff;stroke:#94a3b8;stroke-width:1.5}.hart .h-leg{stroke:#64748b;stroke-width:5;stroke-linecap:round}.hart .h-rail{fill:none;stroke:#64748b;stroke-width:3}
.hart .h-bell{fill:#EF4444}.hart .h-water{fill:#93c5fd;opacity:.7}.hart .h-cable{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round}.hart .h-shoe{fill:#a78bfa}
.hart .h-walk{fill:none;stroke:#475569;stroke-width:3;stroke-linecap:round}.hart .h-chairl{fill:none;stroke:#94a3b8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.hart .h-bag{fill:#eef4ff;stroke:#94a3b8;stroke-width:2}.hart .h-label{fill:#fff;stroke:#cbd5e1}.hart .h-part{fill:#e2e8f0;stroke:#64748b;stroke-width:1.5}.hart .h-filter{fill:#bfdbfe;stroke:#3b82f6;stroke-width:1.5}
.hart .h-chamber{fill:#fff;stroke:#94a3b8;stroke-width:2}.hart .h-fluid{fill:#93c5fd}.hart .h-tube{fill:none;stroke:#94a3b8;stroke-width:4;stroke-linecap:round}.hart .h-clamp{fill:#0062FF;opacity:.85}.hart .h-luer{fill:#10B981}
.hart .h-grid{fill:#fff7f7}.hart .h-gl2{stroke:#fbd5d5;stroke-width:1}.hart .h-ecg{fill:none;stroke:#0f172a;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}

.echip{min-width:58px;min-height:40px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--fg);text-transform:capitalize}
.echip.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.echip.used{opacity:.45}
.echip.e-rot{border-left:10px solid #e11d48}.echip.e-gelb{border-left:10px solid #eab308}.echip.e-grün{border-left:10px solid #16a34a}.echip.e-schwarz{border-left:10px solid #111827}
.torso{display:block;width:100%;max-width:330px;margin:4px auto 10px;touch-action:manipulation}

.tline{fill:none;stroke:var(--fig-line);stroke-width:1.6}.tline.faint{stroke-dasharray:3 4;opacity:.8}
.tlab{font-size:12px;fill:var(--muted);font-weight:600}
.espot{cursor:pointer}
.espot circle{fill:var(--surface);stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3;transition:all .2s}
.espot:hover circle,.espot:focus circle{fill:var(--accent-soft)}
.espot:focus{outline:none}
.espot.set circle{stroke-dasharray:none;fill:var(--accent);}
.espot circle.e-rot{fill:#e11d48}.espot circle.e-gelb{fill:#eab308}.espot circle.e-grün{fill:#16a34a}.espot circle.e-schwarz{fill:#111827}
.espot.ok circle{stroke:var(--ok);stroke-width:4}.espot.bad circle{stroke:var(--bad);stroke-width:4}.espot.miss circle{stroke:var(--warn);stroke-width:3;stroke-dasharray:none}
.elab{font-size:11px;fill:var(--muted);font-weight:600;pointer-events:none}
.vlab{font-size:9.5px;fill:var(--on-accent);font-weight:800;pointer-events:none}
.espot:not(.set) .vlab{fill:var(--fg)}
.bags{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px;margin:10px 0 14px}
.bag{width:100%;display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font-size:13.5px;line-height:1.35;position:relative}
.bag::before{content:"";position:absolute;right:12px;top:12px;width:18px;height:24px;border-radius:5px 5px 8px 8px;background:#b91c1c;opacity:.85}
.bag b{font-size:15px}.bag .bgr{font-weight:700;color:var(--bad-ink)}
.bag.on{border-color:var(--accent);background:var(--accent-soft)}
.bag.ok{border-color:var(--ok);background:var(--ok-soft)}.bag.bad{border-color:var(--bad);background:var(--bad-soft)}
.bscard{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:360px;padding:14px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.bscard>div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.bscard small{color:var(--muted);font-size:12px}
.agg{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#dc2626 0 55%,#f87171 56% 100%);border:3px solid #fff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.agg.on{background:radial-gradient(circle at 30% 35%,#7f1d1d 0 9%,transparent 10%),radial-gradient(circle at 62% 30%,#7f1d1d 0 11%,transparent 12%),radial-gradient(circle at 45% 65%,#7f1d1d 0 13%,transparent 14%),radial-gradient(circle at 72% 66%,#7f1d1d 0 8%,transparent 9%),#fecaca}
.breath{display:grid;gap:12px;justify-items:center;margin:8px 0}
.baby{width:100%;max-width:280px}
.baby svg{width:100%;display:block}
.bbed{fill:var(--surface2)}.bhead{fill:#f6d2b3;stroke:var(--fig-line);stroke-width:1.5}.bbody{fill:#bfdbfe;stroke:var(--fig-line);stroke-width:1.5}.bribs{fill:none;stroke:#64748b;stroke-width:1.6;opacity:0}
.bchest{transform-origin:92px 80px;transform-box:view-box}
.baby.go .bchest{animation:bbreath var(--bp,1s) ease-in-out infinite}
.baby.go .bribs{animation:bribs var(--bp,1s) ease-in-out infinite}
@keyframes bbreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,1.12)}}
@keyframes bribs{0%,40%,100%{opacity:0}50%,60%{opacity:.9}}
.btn.big{min-height:64px;min-width:200px;font-size:18px;border-radius:20px}
.findings{display:grid;gap:6px;padding:12px 14px;border-radius:14px;background:var(--tint);border:1px solid var(--line);font-size:14.5px;margin:10px 0}
@media (prefers-reduced-motion:reduce){.baby.go .bchest,.baby.go .bribs{animation-duration:calc(var(--bp,1s) * 1)}}

/* ---------- Praxisauftrag ---------- */
.pchecks{display:grid;gap:8px;margin-top:12px}
.pcheck{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;line-height:1.45}

.pcheck.on{background:var(--ok-soft);border-color:transparent}
.pcheck.on span{color:var(--muted)}

/* ---------- Praxis-Seite ---------- */
.fgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:4px 14px;margin-top:10px}
.fgrid2 .input{max-width:none;width:100%}
.einfo{margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:14.5px}
.minichips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.mchip{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s}

.ptitem.static{flex-wrap:wrap}
.ptck{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px;font-weight:700;color:var(--muted)}

.skbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:4px 0 10px}
.skbar i{display:block;height:100%;transition:width .4s var(--ease)}
.l3{--c:var(--ok)}.l2{--c:var(--accent)}.l1{--c:var(--warn)}.l0{--c:var(--fig-line)}
.skbar i,.sklegend i{background:var(--c)}
.sklegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:8px}
.sklegend span{display:inline-flex;align-items:center;gap:6px}.sklegend i{width:10px;height:10px;border-radius:3px}
.sklist{display:grid;gap:0;margin-top:12px}
.skrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.skrow b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}.skrow small{color:var(--muted);font-size:12.5px}
.seg4{display:flex;flex:none;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg4 button{hyphens:manual;-webkit-hyphens:manual;border:0;background:none;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}

.seg4 button.l0[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
@media (max-width:640px){.skrow{flex-direction:column;align-items:stretch;gap:8px}.seg4 button{flex:1;padding:8px 2px;font-size:11.5px;white-space:normal;line-height:1.15}}
.gsteps{list-style:none;display:flex;gap:6px;padding:0;margin:14px 0;overflow-x:auto}
.gsteps button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 5px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.gsteps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:12px}

.gsteps .cur{border-color:var(--accent);color:var(--fg)}.gsteps .cur i{background:var(--accent);color:#fff}
.diaryed textarea{max-width:none;width:100%;margin-top:8px;resize:vertical}
.skip.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}.skip.back svg{width:16px;height:16px}
.btn.danger{color:var(--bad-ink)}
.diaryprint{display:none}
@media print{body.print-diary #root{display:none!important}body.print-diary .diaryprint{display:block!important}body.print-diary .diaryprint section{display:none}body.print-diary .diaryprint section.pr{display:block;font:12pt/1.5 Georgia,serif;color:#000}
  body.print-diary .diaryprint h1{font-size:18pt;margin:0 0 4pt}body.print-diary .diaryprint h2{font-size:12pt;margin:14pt 0 2pt}}
.pocket{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;margin-top:12px}
.pcard{margin:0}
.star{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--surface2);color:var(--muted);display:grid;place-items:center}
.star svg{width:20px;height:20px}.star.on{color:#eab308;background:var(--warn-soft)}.star.on svg{fill:currentColor}
.pdl{margin:10px 0 0;display:grid;gap:0}
.pdl>div{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.pdl dt{font-weight:600}.pdl dd{margin:0;color:var(--fg)}
.pnote{font-size:12.5px;margin:8px 0 0}
/* ---------- Blitzrunde ---------- */
.bhead2{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.btimer{flex:1;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.btimer i{display:block;height:100%;background:var(--accent);transition:width .25s linear}.btimer i.low{background:var(--bad)}

.tbody path,.tbody circle{fill:var(--surface2);stroke:var(--fig-line);stroke-width:2}
.bface{fill:#334155}.bmouth,.barm{fill:none;stroke:#94a3b8;stroke-width:2;stroke-linecap:round}
/* ---------- Aufgaben ---------- */
.chip svg{width:13px;height:13px;margin-right:4px;vertical-align:-2px}
.chip.warnc{background:var(--warn-soft);color:var(--warn-ink)}.chip.badc{background:var(--bad-soft);color:var(--bad-ink)}
.tab{position:relative}
.tbadge{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font:700 11px/18px var(--font);font-style:normal;text-align:center}

@media (max-width:959px){.tabbar .tab.akteb{display:none}}
.alist{display:grid;gap:10px}
.aitem,.ateaser{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow);transition:border-color .2s,transform .2s var(--ease)}
.aitem:hover,.ateaser:hover{border-color:var(--accent);transform:translateY(-1px)}
.aitem>svg,.ateaser>svg{width:18px;height:18px;flex:none;color:var(--muted)}
.aic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.aitem.done .aic{background:var(--ok-soft);color:var(--ok-ink)}
.abody{display:flex;flex-direction:column;min-width:0;flex:1}
.abody b,.ateaser b{display:block;font-size:16px;line-height:1.3;margin-top:3px}
.abody small,.ateaser small{display:block;color:var(--muted);font-size:13.5px;margin-top:3px}
.abody .bar{display:block}
.ateaser{margin-top:4px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.adates{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px;margin:16px 0 0}
.adates>div{padding:10px 12px;border-radius:12px;background:var(--surface2)}
.adates dt{font-size:12px;color:var(--muted);font-weight:600}.adates dd{margin:2px 0 0;font-size:14px;font-weight:600}
.alock{display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:16px;border-radius:16px;border:1px dashed var(--line);background:var(--tint)}

.ainstr{margin:16px 0 0;font-size:16px;line-height:1.6;white-space:pre-line}
.afeed{margin-top:16px;padding:14px 16px;border-radius:16px;background:var(--accent-soft);border-left:4px solid var(--accent)}

.adetail textarea{max-width:none;width:100%;resize:vertical}

/* ---------- Praxisvorbereitung ---------- */
.phero h2{font-size:28px;margin:6px 0 8px;letter-spacing:-.02em}.phero p{line-height:1.6}
.pready{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--accent-soft)}
.pready>div{flex:1 1 220px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.pcard2{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow);transition:border-color .2s,transform .2s var(--ease)}
.pcard2:hover{border-color:var(--accent);transform:translateY(-1px)}
.pcard2 b{display:block;font-size:16px;margin-top:2px}.pcard2 small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pcard2>svg{width:18px;height:18px;flex:none;color:var(--muted)}
.pacclist{display:grid;gap:10px}
.pacc{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.pacc.on{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}

.pgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
