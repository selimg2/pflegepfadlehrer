.pdo b{color:var(--ok-ink)}.pdont b{color:var(--bad-ink)}.pdo ul,.pdont ul{margin:6px 0 0;padding-left:20px;font-size:14.5px;display:grid;gap:4px}
.pscen{padding:14px 0;border-top:1px solid var(--line)}.pscen:first-child{border-top:0;padding-top:0}

.htmlarea .hbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.hbar button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;height:30px;font-size:13px;padding:0 8px;color:var(--fg)}.hbar span{font-size:12px;color:var(--muted);margin-left:6px}
.htmlarea textarea{width:100%}
.charpick{position:relative}.charbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px 6px 6px;color:var(--fg);font-weight:600;width:100%}.charbtn>svg{width:16px;height:16px;margin-left:auto}
.chargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:8px;max-height:280px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.charitem{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;border-radius:12px;padding:6px 2px;color:var(--fg)}.charitem[aria-pressed="true"]{background:var(--accent-soft)}.charitem small{font-size:11.5px;text-align:center;line-height:1.2}.charitem .cav{width:48px;height:48px}
.figprev{max-width:360px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}.figprev svg{display:block;width:100%;height:auto}
.ferr{color:var(--bad-ink);font-size:12.5px}
.ckgrid{display:flex;flex-wrap:wrap;gap:4px 18px}
.bhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.jsondet summary{cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:600}
.jsonview{max-height:420px;overflow:auto;background:var(--surface2);border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
input.num{max-width:180px}
@media (max-width:420px){.tabbar .tab span{font-size:10px}.tabbar .tab{min-width:56px;padding:8px 2px 6px}.hide-s{display:none}.edact .btn{flex:1}}
.kpis .card,.quick .card,.clist .card,.palgrid .card{margin:0}
.matrix td.mc.hi{color:#fff}
.edgrid>*{min-width:0}
@media (max-width:860px){.edgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis b{font-size:28px}}
/* ---------- Aufgaben ---------- */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.acard{margin:0;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;color:var(--fg);transition:border-color .2s,transform .2s var(--ease)}
.acard:hover{border-color:var(--accent);transform:translateY(-1px)}
.acard h3{margin:4px 0 0;font-size:17px}
.abar{display:flex;height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.abar.sm{height:6px;margin-top:8px}
.abar i{display:block;height:100%}.abar i.ok{background:var(--ok)}.abar i.part{background:var(--warn)}
.kpis.small.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.kpis.small.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.adates2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin:12px 0 0}
.adates2>div{padding:8px 10px;border-radius:12px;background:var(--surface2)}.adates2 dt{font-size:12px;color:var(--muted);font-weight:600}.adates2 dd{margin:2px 0 0;font-size:13.5px;font-weight:600}
.aqs{margin:8px 0 0;padding-left:20px;font-size:14.5px}
.arow2{border-top:1px solid var(--line)}.arow2:first-child{border-top:0}
.arh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;padding:12px 16px;border:0;background:none;text-align:left;color:var(--fg)}
.arh:disabled{cursor:default;opacity:1}
.arh b{display:block;font-size:15px}.arh small{display:block;color:var(--muted);font-size:12.5px}
.arh>svg{width:18px;height:18px;color:var(--muted)}
.minibar{position:relative;width:90px;height:20px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:none}
.minibar i{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 28%,transparent)}.minibar em{position:relative;display:block;text-align:center;font:600 11.5px/20px var(--font);font-style:normal}
.arb{padding:0 16px 16px}
.arb textarea{max-width:none;width:100%}
.aform{display:flex;flex-direction:column;gap:14px}
.aform fieldset{border:0;padding:0;margin:0}.aform legend,.flabel{font-weight:600;font-size:14.5px;margin-bottom:6px;display:block}
.aform .input{max-width:none;width:100%}
.cchecks{display:flex;flex-wrap:wrap;gap:8px}
.cchk{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14.5px}
.cchk small{color:var(--muted);font-weight:500;font-size:12.5px}
.cchk.on{border-color:var(--accent);background:var(--accent-soft)}
.cchk input{accent-color:var(--accent);width:17px;height:17px;margin:0}
.adt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.adt small{font-size:12.5px}
/* ---------- Unterrichtskonzept & Arbeitsblatt ---------- */
.kzbtn{width:100%;justify-content:center;margin-top:2px}
.kzbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:-1px;z-index:2;background:var(--surface);padding:4px 0 12px;border-bottom:1px solid var(--line)}
.kz{padding-top:6px}
.kzhead h2{font-size:26px;margin:6px 0 10px;letter-spacing:-.02em}
.kz section{padding:18px 0;border-bottom:1px solid var(--line)}.kz section:last-child{border-bottom:0}
.kz h3{font-size:18px;margin:0 0 10px}.kz h4{font-size:15px;margin:14px 0 6px}
.kz p,.kz li{font-size:15px;line-height:1.6}.kz ol,.kz ul{padding-left:22px;margin:6px 0}
.kzdl{display:grid;gap:10px;margin:0}
.kzdl>div{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.kzdl dt{font-weight:650;font-size:13.5px;color:var(--muted)}.kzdl dd{margin:0;font-size:14.5px;line-height:1.5}.kzdl dd ul{margin:0}
@media (max-width:640px){.kzdl>div{grid-template-columns:1fr;gap:4px}}
.kzce{display:block;margin-bottom:4px}.kzce b{display:inline-block;min-width:52px;color:var(--accent)}
.kztl{display:grid;gap:10px}
.kzph{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:14px;border-radius:16px;border:1px solid var(--line)}
.kzmin{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--accent-soft);color:var(--accent);height:64px}
.kzmin b{font-size:24px;line-height:1}.kzmin span{font-size:12px;font-weight:600}
.kzbody h4{margin:0 0 6px;font-size:16px}.kzbody p{margin:0 0 8px}
.kzqrs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.kzqr{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#111;max-width:260px}
.kzqr>div{width:72px;flex:none}.kzqr svg{width:100%;height:auto;display:block}.kzqr span{font-size:12.5px;line-height:1.35}.kzqr b{display:block}
.kzcheck{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:6px}
.kzcheck li{display:flex;gap:10px;align-items:flex-start}
.kzbox{width:16px;height:16px;border:2px solid var(--muted);border-radius:4px;flex:none;margin-top:4px}
.wsprev{margin-top:12px;padding:16px;border-radius:16px;background:var(--surface2)}
.ws{background:#fff;color:#111;padding:28px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.08);font:14px/1.5 Georgia,"Times New Roman",serif;max-width:800px;margin:0 auto}
.ws h1{font:700 22px/1.25 var(--font);margin:4px 0 4px;color:#111}.ws h2{font:700 15px/1.3 var(--font);margin:20px 0 6px;color:#111;border-bottom:2px solid #111;padding-bottom:3px}
.ws p{margin:4px 0}.wseye{font:600 11px var(--font);letter-spacing:.08em;text-transform:uppercase;color:#555}
.wshead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.wsmeta{display:flex;flex-direction:column;gap:8px;font:13px var(--font)}
.wsinfo{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;padding:8px 10px;border:1px solid #bbb;border-radius:6px;font:13px var(--font)}
.wsqrs{display:flex;flex-wrap:wrap;gap:12px}
.wsqr{display:flex;flex-direction:column;align-items:center;text-align:center;width:150px;font:12px/1.3 var(--font)}
.wsqrimg{width:110px}.wsqrimg svg{width:100%;height:auto;display:block}
.wssmall{font-size:12.5px;color:#444}
.wsline{border-bottom:1px solid #999;height:24px}
.wslf{padding-left:20px}.wslf li{margin-bottom:8px}
.wstab{width:100%;border-collapse:collapse;font:13px var(--font);margin-top:6px}
.wstab th,.wstab td{border:1px solid #888;padding:6px;text-align:left;vertical-align:top}.wstab td{height:30px}
.wstab th:nth-child(n+2):nth-child(-n+4),.wstab td:nth-child(n+2):nth-child(-n+4){width:62px;text-align:center}
.wsfb{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;font:13px var(--font)}
.wsfoot{margin-top:18px!important;font:italic 11.5px var(--font);color:#555}
#printarea{display:none}
@media print{
  html.printing-ws body>*:not(#printarea){display:none!important}
  html.printing-ws #printarea{display:block!important}
  html.printing-ws body{background:#fff!important}
  html.printing-ws .ws{box-shadow:none;padding:0;max-width:none}
  html.printing-ws .ws h2{break-after:avoid}html.printing-ws .wstab,html.printing-ws .wsqrs{break-inside:avoid}
  html.printing-ws .kz{color:#000}html.printing-ws .kz section{break-inside:avoid-page}
  html.printing-ws .kzqr{border:1px solid #999}
  @page{margin:16mm}
}
/* ---------- PflAPrV-Auditbericht ---------- */
.aucta{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:16px 0;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}

.aucic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#0b2a5b;color:#fff;flex:none}.aucic svg{width:24px;height:24px}
.aubtn{white-space:normal;text-align:left;max-width:100%}
.auform{display:flex;flex-direction:column;gap:14px}.auform fieldset{border:0;padding:0;margin:0}.auform legend{font-weight:600;font-size:14.5px;margin-bottom:6px}.auform .input{max-width:none;width:100%}
.auprev{max-height:70vh;overflow:auto}
.aurep{font:10.5pt/1.45 "Helvetica Neue",Arial,sans-serif;color:#111}
.aupage{background:#fff;color:#111;padding:28px 32px;margin:0 auto 18px;max-width:820px;box-shadow:0 2px 12px rgba(0,0,0,.1);border-radius:4px}
.auhead{display:flex;justify-content:space-between;gap:16px;border-bottom:3px solid #0b2a5b;padding-bottom:10px;margin-bottom:14px}
.auhead h1{font-size:16pt;line-height:1.2;margin:2px 0 4px;color:#0b2a5b}.auhead p{margin:0;font-size:9.5pt;color:#444}
.aueye{font-size:8.5pt;letter-spacing:.08em;text-transform:uppercase;color:#555;font-weight:700}
.aulogo{text-align:right;flex:none}.aulogo b{display:block;font-size:12pt;color:#0b2a5b}.aulogo span{font-size:8pt;color:#666}
.aurep h2{font-size:11.5pt;color:#0b2a5b;margin:16px 0 6px;border-bottom:1px solid #c9d3e3;padding-bottom:3px}
.aurep table{width:100%;border-collapse:collapse;font-size:9pt}
.aurep th,.aurep td{border:1px solid #b8c2d3;padding:5px 6px;text-align:left;vertical-align:top}
.aurep thead th{background:#eaf0f8;color:#0b2a5b;font-weight:700}
.aurep tfoot td{background:#f4f6fa;font-weight:700}
.aurep .r{text-align:right;white-space:nowrap}.aurep .c{text-align:center}
.aurep td small{display:block;color:#777;font-size:7.5pt}
.austamm th{width:18%;background:#f4f6fa;font-weight:600;color:#333}
.aubadge{display:inline-block;padding:2px 7px;border-radius:99px;font-size:8pt;font-weight:700;border:1px solid #9aa6b8;color:#444;white-space:nowrap}
.aubadge.ok{background:#e7f6ec;border-color:#2f855a;color:#22543d}.aubadge.part{background:#fff7e0;border-color:#b7791f;color:#744210}
.aufn{font-size:8pt;color:#555;margin:6px 0 0}
.aumeth p{font-size:9pt;margin:4px 0;color:#222}
.autestat{margin-top:22px;border-top:2px solid #0b2a5b;padding-top:10px}
.autxt{font-weight:700;margin:0 0 28px}
.ausig{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:18px;align-items:end}
.auline{display:block;border-bottom:1px solid #111;height:30px}.ausig small{font-size:8pt;color:#444}
.austempel{border:1px dashed #888;height:80px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;border-radius:50%/40%}
@media print{
  html.printing-ws .aupage{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0;break-after:page}
  html.printing-ws .aupage:last-child{break-after:auto}
  html.printing-ws .aurep tr{break-inside:avoid}
  html.printing-ws .aurep thead{display:table-header-group}
}
